services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lifegift
      MYSQL_USER: lifegift
      MYSQL_PASSWORD: lifegift_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./lifegift.sql:/docker-entrypoint-initdb.d/01-lifegift.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai:
    build:
      context: ./AI
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./lifegift-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://lifegift:lifegift_dev_password@mysql:3306/lifegift
      PORT: 8080
      AI_SERVICE_URL: http://ai:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-this-development-secret
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: change-this-development-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./fe
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5500:80"

volumes:
  mysql_data:
  redis_data:
